name: Issue template
description: Create issue from template
title: "[BUG/FEATURE/OTHER] - short description of your issue"
assignees: []
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Little Piggy Tracker by submitting this report.
        Feature requests submitted here will be considered for future updates as time and resources allow.
  - type: textarea
    id: logs
    attributes:
      label: lgpt.log
      description: |
        For bugs, attach the log file. If you paste it instead, wrap it in a code block (```) so it displays correctly.
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform configuration
      description: Select your platform.
      options:
        - Desktop
        - Handheld
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device, OS and audio configuration
      description: For bugs, give the device or console model, OS version and audio setup (driver, interface, buffer size).
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Build version
      description: Enter the Little Piggy Tracker version, if applicable.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Description and steps to reproduce
      description: Describe the issue or feature request in detail. For bugs, list the steps to reproduce it.
    validations:
      required: true
